<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cubitt Admin</title>
  <style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --text: #111827; --muted: #6b7280; --border: #e5e7eb; --border-strong: #d1d5db;
  --brand: #0f766e; --brand-ink: #ffffff; --brand-soft: #e6f4f2;
  --ok: #047857; --ok-soft: #ecfdf5; --warn: #b45309; --warn-soft: #fffbeb; --bad: #b91c1c; --bad-soft: #fef2f2; --info: #1d4ed8; --info-soft: #eff6ff;
  --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 1px 8px rgba(0,0,0,.04);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0f14; --card: #131a22; --text: #e5e7eb; --muted: #9aa4b2; --border: #233040; --border-strong: #31404f;
    --brand: #2dd4bf; --brand-ink: #04201c; --brand-soft: #0f2a28;
    --ok: #34d399; --ok-soft: #0c2a20; --warn: #fbbf24; --warn-soft: #2a2110; --bad: #f87171; --bad-soft: #2c1414; --info: #93c5fd; --info-soft: #102036;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); }
.oculto { display: none !important; }

/* Estructura */
.app { display: flex; min-height: 100vh; }
.lateral { width: 230px; flex-shrink: 0; background: var(--card); border-right: 1px solid var(--border); padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.marca { font-weight: 800; font-size: 1.15rem; padding: 4px 10px 14px; letter-spacing: -.01em; }
.marca small { display: block; font-weight: 500; font-size: .78rem; color: var(--muted); }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; text-align: left; color: var(--text); font-weight: 500; }
.nav-item:hover { background: var(--bg); }
.nav-item.activo { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.nav-item .ico { width: 22px; text-align: center; }
.nav-sep { height: 1px; background: var(--border); margin: 10px 4px; }
.principal { flex: 1; min-width: 0; padding: 20px 24px 90px; max-width: 1200px; }
.barra-sup { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.barra-sup h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
.usuario-chip { font-size: .82rem; color: var(--muted); }
.inferior { display: none; }

@media (max-width: 820px) {
  .lateral { display: none; }
  .principal { padding: 14px 14px 96px; }
  .inferior { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); z-index: 40; padding-bottom: env(safe-area-inset-bottom); }
  .inferior button { flex: 1; border: 0; background: none; padding: 8px 2px 7px; font-size: .7rem; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); cursor: pointer; }
  .inferior button .ico { font-size: 1.2rem; }
  .inferior button.activo { color: var(--brand); font-weight: 700; }
}

/* Tarjetas y grillas */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; min-width: 0; }
.card h2 { font-size: 1rem; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 820px) { .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .g2.apilar, .g3, .g4.apilar { grid-template-columns: minmax(0, 1fr); } }
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
.kpi .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; }
.kpi .val { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .sub { font-size: .78rem; color: var(--muted); }
.kpi.clic { cursor: pointer; }
.kpi.clic:hover { border-color: var(--brand); }
.val.ok { color: var(--ok); } .val.warn { color: var(--warn); } .val.bad { color: var(--bad); }

/* Formularios */
label.campo { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; font-weight: 600; color: var(--muted); min-width: 0; }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--border-strong); background: var(--card); border-radius: 8px; padding: 9px 10px; font-size: .95rem; color: var(--text); min-width: 0; }
.input:focus { outline: 2px solid var(--brand); outline-offset: -1px; border-color: var(--brand); }
textarea.input { min-height: 64px; resize: vertical; }
.fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.fila > * { flex: 1 1 140px; }
.segmento { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 9px; overflow: hidden; }
.segmento button { border: 0; background: var(--card); padding: 9px 14px; cursor: pointer; font-weight: 600; }
.segmento button + button { border-left: 1px solid var(--border-strong); }
.segmento button.activo { background: var(--brand); color: var(--brand-ink); }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 600; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--brand); }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--card); color: var(--text); padding: 9px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: .9rem; white-space: nowrap; }
.btn:hover { border-color: var(--brand); }
.btn.prim { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.peligro { color: var(--bad); border-color: var(--bad); }
.btn.peq { padding: 5px 10px; font-size: .8rem; }
.btn.bloque { width: 100%; }
.btn:disabled { opacity: .55; cursor: wait; }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* Tablas */
.tabla-env { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
table.tabla { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tabla th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 8px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tabla td { padding: 9px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tabla tr.clic { cursor: pointer; }
.tabla tr.clic:hover td { background: var(--bg); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabla tfoot td { font-weight: 800; border-top: 2px solid var(--border-strong); }
.muted { color: var(--muted); }
.peq { font-size: .8rem; }
.fuerte { font-weight: 700; }

/* Etiquetas */
.tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .72rem; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.info { background: var(--info-soft); color: var(--info); }
.tag.gris { background: var(--bg); color: var(--muted); border-color: var(--border); }

/* Lista tipo tarjeta (móvil) */
.lista-item { display: flex; justify-content: space-between; gap: 10px; padding: 11px 2px; border-bottom: 1px solid var(--border); cursor: pointer; }
.lista-item:last-child { border-bottom: 0; }
.lista-item .izq { min-width: 0; }
.lista-item .titulo { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.lista-item .det { font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.lista-item .der { text-align: right; flex-shrink: 0; }
.solo-escritorio { }
.solo-movil { display: none; }
@media (max-width: 820px) { .solo-escritorio { display: none; } .solo-movil { display: block; } }

/* Avisos */
.aviso { border-radius: 10px; padding: 10px 12px; font-size: .88rem; margin-bottom: 12px; border: 1px solid; white-space: pre-line; }
.aviso.warn { background: var(--warn-soft); color: var(--warn); border-color: currentColor; }
.aviso.bad { background: var(--bad-soft); color: var(--bad); border-color: currentColor; }
.aviso.info { background: var(--info-soft); color: var(--info); border-color: currentColor; }
.aviso.ok { background: var(--ok-soft); color: var(--ok); border-color: currentColor; }
.vacio { text-align: center; color: var(--muted); padding: 28px 10px; }

/* Modal */
.modal-fondo { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 30px 12px; overflow-y: auto; }
.modal { background: var(--card); border-radius: 14px; width: 100%; max-width: 680px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal.ancho { max-width: 980px; }
.modal-cab { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); gap: 10px; }
.modal-cab h3 { margin: 0; font-size: 1.05rem; }
.modal-cuerpo { padding: 16px; }
.cerrar { border: 0; background: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); line-height: 1; }
@media (max-width: 600px) { .modal-fondo { padding: 0; } .modal { border-radius: 0; min-height: 100vh; } }

/* Toast y carga */
.toasts { position: fixed; top: 14px; right: 14px; left: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 80; pointer-events: none; }
.toast { background: #111827; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: .9rem; max-width: 440px; box-shadow: 0 8px 24px rgba(0,0,0,.25); pointer-events: auto; white-space: pre-line; }
.toast.bad { background: #991b1b; } .toast.ok { background: #065f46; }
.cargando { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--brand), transparent); background-size: 200% 100%; animation: barra 1s linear infinite; z-index: 90; }
@keyframes barra { from { background-position: 100% 0; } to { background-position: -100% 0; } }

/* Login */
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login .card { width: 100%; max-width: 380px; padding: 24px; }
.login h1 { margin: 0 0 4px; font-size: 1.5rem; }

/* Líneas de venta / compra */
.linea-prod { display: grid; grid-template-columns: minmax(0, 1fr) 70px 90px 80px 34px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border); }
.linea-prod .desc { min-width: 0; font-size: .88rem; }
.linea-prod .desc b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linea-prod input { padding: 6px 8px; }
@media (max-width: 560px) { .linea-prod { grid-template-columns: minmax(0, 1fr) 60px 80px 34px; } .linea-prod .col-com { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; } }
.total-grande { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.sugerencias { position: absolute; left: 0; right: 0; top: 100%; background: var(--card); border: 1px solid var(--border-strong); border-radius: 9px; max-height: 300px; overflow-y: auto; z-index: 30; box-shadow: 0 10px 30px rgba(0,0,0,.15); }
.sugerencias div { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: .88rem; }
.sugerencias div:hover, .sugerencias div.sel { background: var(--brand-soft); }
.rel { position: relative; }
.barra-progreso { height: 8px; border-radius: 99px; background: var(--bg); overflow: hidden; }
.barra-progreso > div { height: 100%; background: var(--brand); }
</style>

</head>
<body>
  <div id="raiz"></div>
  <div id="modal"></div>
  <div class="toasts" id="toasts"></div>
  <div class="cargando oculto" id="cargando"></div>
  <script>
(function () {
  'use strict';

  // ======================================================================
  // Estado y utilidades
  // ======================================================================
  var S = { token: null, usuario: null, ini: null, vista: 'inicio', ajustesTab: 'productos', filtrosVentas: null, venta: null, compra: null };
  var CLAVE_TOKEN = 'cubitt_admin_token';

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function n(v) { var x = parseFloat(String(v === undefined || v === null ? '' : v).replace(',', '.')); return isFinite(x) ? x : 0; }
  function r2(v) { return Math.round((n(v) + 1e-9) * 100) / 100; }
  function dinero(v) { var x = r2(v); return (x < 0 ? '-$' : '$') + Math.abs(x).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fecha(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0].slice(2) : iso; }
  function hoy() {
    if (S.ini && S.ini.hoy) return S.ini.hoy;
    var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function inicioMes() { return hoy().slice(0, 8) + '01'; }
  function esAdmin() { return S.usuario && S.usuario.rol === 'ADMIN'; }
  function guardarToken(t) { try { if (t) localStorage.setItem(CLAVE_TOKEN, t); else localStorage.removeItem(CLAVE_TOKEN); } catch (e) {} }
  function leerToken() { try { return localStorage.getItem(CLAVE_TOKEN); } catch (e) { return null; } }
  function opciones(lista, valor, vacio) {
    return (vacio !== undefined ? '<option value="">' + esc(vacio) + '</option>' : '') + lista.map(function (o) {
      return '<option value="' + esc(o.v) + '"' + (String(o.v) === String(valor) ? ' selected' : '') + '>' + esc(o.t) + '</option>';
    }).join('');
  }
  function optVendedores(valor, vacio, soloActivos) {
    return opciones((S.ini.vendedores || []).filter(function (v) { return !soloActivos || v.activo !== 'NO'; }).map(function (v) { return { v: v.id, t: v.nombre }; }), valor, vacio);
  }
  function optUbicaciones(valor, vacio) { return opciones(S.ini.ubicaciones.map(function (u) { return { v: u.id, t: u.nombre }; }), valor, vacio); }
  function nombreUbicacion(id) { var u = (S.ini.ubicaciones || []).filter(function (x) { return x.id === id; })[0]; return u ? u.nombre : id; }
  function productoPorSku(sku) { sku = String(sku || '').toUpperCase(); return (S.ini.productos || []).filter(function (p) { return p.sku === sku; })[0]; }
  function descProducto(p) { return p ? ([p.linea, p.modelo, p.color].filter(Boolean).join(' · ') || p.descripcion || p.sku) : ''; }
  function comisionSugerida(p, q) {
    if (!p) return 0;
    var c = p.comision !== '' && p.comision !== undefined && p.comision !== null ? n(p.comision) : null;
    if (c === null && p.linea) {
      var l = (S.ini.lineas || []).filter(function (x) { return x.nombre === p.linea; })[0];
      if (l && l.comision !== '' && l.comision !== undefined) c = n(l.comision);
    }
    return r2((c || 0) * (n(q) || 1));
  }
  function tagEstado(e) {
    var m = { PAGADA: ['ok', 'Pagada'], ABONADA: ['warn', 'Abonada'], PENDIENTE: ['bad', 'Pendiente'], ANULADA: ['gris', 'Anulada'], PAGO_DE_MAS: ['info', 'Pago de más'] }[e] || ['gris', e];
    return '<span class="tag ' + m[0] + '">' + m[1] + '</span>';
  }

  var nCarga = 0;
  function cargando(on) { nCarga += on ? 1 : -1; if (nCarga < 0) nCarga = 0; $('cargando').classList.toggle('oculto', nCarga === 0); }
  function toast(msg, tipo) {
    var d = document.createElement('div');
    d.className = 'toast ' + (tipo || '');
    d.textContent = msg;
    $('toasts').appendChild(d);
    setTimeout(function () { d.remove(); }, tipo === 'bad' ? 7000 : 3500);
  }

  // ======================================================================
  // Comunicación con el servidor (Apps Script)
  // ======================================================================
  function llamar(fn, args) {
    return new Promise(function (resolve, reject) {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(new Error((e && e.message) || 'No hay conexión con el servidor. Revisa tu internet e intenta de nuevo.')); });
        r[fn].apply(r, args || []);
      } else if (window.__servidor) {
        Promise.resolve(window.__servidor(fn, args || [])).then(resolve, reject);
      } else {
        reject(new Error('Esta página debe abrirse desde la aplicación publicada en Google Apps Script.'));
      }
    });
  }

  function api(accion, datos) {
    cargando(true);
    return llamar('api', [S.token, accion, datos || {}]).then(function (r) {
      cargando(false);
      if (r && r.ok) return r.data;
      var err = (r && r.error) || 'Error desconocido';
      if (err === 'SESION_VENCIDA') { cerrarSesionLocal(); pantallaLogin('Tu sesión venció. Ingresa de nuevo.'); }
      if (err === 'DEBE_CAMBIAR_CLAVE') { pantallaCambioClave(true); }
      throw new Error(err);
    }, function (e) { cargando(false); throw e; });
  }

  function mostrarError(e, contenedor) {
    var msg = (e && e.message) || String(e);
    if (msg === 'SESION_VENCIDA' || msg === 'DEBE_CAMBIAR_CLAVE') return;
    msg = msg.replace(/^(STOCK_INSUFICIENTE|DUPLICADO): /, '');
    if (contenedor) contenedor.innerHTML = '<div class="aviso bad">' + esc(msg) + '</div>';
    else toast(msg, 'bad');
  }

  function cerrarSesionLocal() { S.token = null; S.usuario = null; S.ini = null; guardarToken(null); }

  function refrescarInicial() {
    return api('inicial').then(function (ini) { S.ini = ini; S.usuario = ini.usuario; });
  }

  // ======================================================================
  // Delegación de eventos: data-a="accion"
  // ======================================================================
  var A = {};
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]');
    if (!el || el.disabled) return;
    var f = A[el.getAttribute('data-a')];
    if (f) { e.preventDefault(); f(el, e); }
  });
  document.addEventListener('submit', function (e) {
    var f = A[e.target.getAttribute('data-submit')];
    if (f) { e.preventDefault(); f(e.target, e); }
  });

  function datosForm(form) {
    var o = {};
    Array.prototype.forEach.call(form.elements, function (el) {
      if (!el.name) return;
      o[el.name] = el.type === 'checkbox' ? el.checked : el.value;
    });
    return o;
  }

  function conBoton(btn, promesa) {
    if (btn) btn.disabled = true;
    return promesa.then(function (x) { if (btn) btn.disabled = false; return x; }, function (e) { if (btn) btn.disabled = false; throw e; });
  }

  // ======================================================================
  // Modal
  // ======================================================================
  function abrirModal(titulo, html, ancho) {
    $('modal').innerHTML = '<div class="modal-fondo"><div class="modal' + (ancho ? ' ancho' : '') + '" role="dialog" aria-modal="true">' +
      '<div class="modal-cab"><h3>' + esc(titulo) + '</h3><button class="cerrar" data-a="cerrarModal" aria-label="Cerrar">×</button></div>' +
      '<div class="modal-cuerpo" id="modalCuerpo">' + html + '</div></div></div>';
    document.body.style.overflow = 'hidden';
  }
  function cerrarModal() { $('modal').innerHTML = ''; document.body.style.overflow = ''; }
  A.cerrarModal = cerrarModal;
  // Clic fuera de la ventana la cierra (sin interferir con formularios ni botones de adentro)
  document.addEventListener('mousedown', function (e) {
    if (e.target.classList && e.target.classList.contains('modal-fondo') && e.target.parentNode === $('modal')) cerrarModal();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('modal').innerHTML) cerrarModal(); });

  // Diálogos propios (prompt/confirm pueden estar bloqueados dentro de Apps Script)
  function dialogo(titulo, opciones) {
    opciones = opciones || {};
    return new Promise(function (resolve) {
      var capa = document.createElement('div');
      capa.className = 'modal-fondo';
      capa.style.zIndex = 70;
      capa.innerHTML = '<div class="modal" style="max-width:440px"><div class="modal-cab"><h3>' + esc(titulo) + '</h3></div><form class="modal-cuerpo grid">' +
        (opciones.texto ? '<div class="peq">' + esc(opciones.texto) + '</div>' : '') +
        (opciones.campo ? '<label class="campo">' + esc(opciones.campo) + '<input class="input" name="valor" type="' + (opciones.tipo || 'text') + '" value="' + esc(opciones.valor || '') + '"' + (opciones.max ? ' max="' + esc(opciones.max) + '"' : '') + (opciones.requerido ? ' required' : '') + '></label>' : '') +

  // Buscador de productos con sugerencias
  // ======================================================================
  function montarBuscador(input, cfg) {
    var caja = document.createElement('div');
    caja.className = 'sugerencias oculto';
    input.parentNode.appendChild(caja);
    var sel = -1, actuales = [];
    function filtrar() {
      var q = input.value.trim().toUpperCase();
      if (!q) { caja.classList.add('oculto'); return; }
      var palabras = q.split(/\s+/);
      actuales = (S.ini.productos || []).filter(function (p) {
        if (p.activo === 'NO' && !cfg.incluirInactivos) return false;
        var t = (p.sku + ' ' + p.linea + ' ' + p.modelo + ' ' + p.color + ' ' + p.descripcion).toUpperCase();
        return palabras.every(function (w) { return t.indexOf(w) !== -1; });
      }).slice(0, 40);
      sel = actuales.length ? 0 : -1;
      var html = actuales.map(function (p, i) {
        var st = cfg.ubicacion ? (p.stock[cfg.ubicacion()] || 0) : p.stockTotal;
        return '<div data-i="' + i + '" class="' + (i === sel ? 'sel' : '') + '"><b>' + esc(p.sku) + '</b> · ' + esc(descProducto(p)) +
          ' <span class="tag ' + (st > 0 ? 'ok' : st < 0 ? 'bad' : 'gris') + '">' + st + ' und</span>' + (p.pvp ? ' <span class="muted">' + dinero(p.pvp) + '</span>' : '') + '</div>';
      }).join('');
      if (cfg.permitirNuevo && /^[A-Z0-9][A-Z0-9\-_.\/]{2,}$/.test(q.replace(/\s+/g, '')) && !productoPorSku(q.replace(/\s+/g, ''))) {
        html += '<div data-nuevo="1">➕ Usar código nuevo <b>' + esc(q.replace(/\s+/g, '')) + '</b></div>';
      }
      caja.innerHTML = html || '<div class="muted">Sin coincidencias</div>';
      caja.classList.remove('oculto');
    }
    function elegir(p) { caja.classList.add('oculto'); input.value = ''; cfg.alElegir(p); input.focus(); }
    input.addEventListener('input', filtrar);
    input.addEventListener('focus', filtrar);
    input.addEventListener('blur', function () { setTimeout(function () { caja.classList.add('oculto'); }, 200); });
    input.addEventListener('keydown', function (e) {
      if (caja.classList.contains('oculto')) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        sel = Math.max(0, Math.min(actuales.length - 1, sel + (e.key === 'ArrowDown' ? 1 : -1)));
        Array.prototype.forEach.call(caja.children, function (c, i) { c.classList.toggle('sel', i === sel); });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (sel >= 0 && actuales[sel]) elegir(actuales[sel]);
        else if (cfg.permitirNuevo && caja.querySelector('[data-nuevo]')) elegir({ sku: input.value.trim().toUpperCase().replace(/\s+/g, ''), nuevo: true });
      }
    });
    caja.addEventListener('mousedown', function (e) {
      var d = e.target.closest('div');
      if (!d) return;
      e.preventDefault();
      if (d.getAttribute('data-nuevo')) elegir({ sku: input.value.trim().toUpperCase().replace(/\s+/g, ''), nuevo: true });
      else if (d.getAttribute('data-i') !== null) elegir(actuales[Number(d.getAttribute('data-i'))]);
    });
  }

      alElegir: function (p) {
        var ya = S.venta.items.filter(function (it) { return it.sku === p.sku; })[0];

  function actualizarTotalesVenta() {
    var v = S.venta, total = totalVenta();

    document.querySelectorAll('[data-a=tipoVenta]').forEach(function (b) { b.classList.toggle('activo', b.getAttribute('data-t') === v.tipo); });
    var pi = document.querySelector('[data-v-campo=pago_inicial]');

  function subirArchivo(file, alTerminar) {
    if (file.size > 25 * 1024 * 1024) { toast('El archivo es muy grande (máx. 25 MB).', 'bad'); return; }
    leerArchivo(file).then(function (d) {

  // Comprime fotos grandes (las facturas no necesitan más de ~2000 px)
  function leerArchivo(file) {
    return new Promise(function (resolve, reject) {
      var lector = new FileReader();
      lector.onerror = function () { reject(new Error('No se pudo leer el archivo.')); };
      lector.onload = function () {
        var dataUrl = lector.result;
        var mime = file.type || 'application/octet-stream';
        if (!/^image\/(jpeg|png|webp)$/.test(mime)) return resolve({ mime: mime, base64: dataUrl.split(',')[1] });
        var img = new Image();
        img.onload = function () {
          var max = 2000, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
          var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          resolve({ mime: 'image/jpeg', base64: cv.toDataURL('image/jpeg', 0.85).split(',')[1] });
        };
        img.onerror = function () { resolve({ mime: mime, base64: dataUrl.split(',')[1] }); };
        img.src = dataUrl;
      };
      lector.readAsDataURL(file);
    });
  }

  AJ.migracion = function (c) {
    return api('config').then(function (cf) {
      c.innerHTML = '<div class="card"><h2>Migrar el histórico desde la hoja «Cubitt»</h2>' +
        '<p class="peq">Importa las pestañas <b>Ventas</b> (con PAGO 1–5 y las fechas que dejaste como comentarios), <b>BDD</b> (catálogo) y <b>Compras_Nueva</b> (facturas). Primero pulsa <b>Analizar</b>: verás un reporte sin guardar nada. Si todo se ve bien, pulsa <b>Migrar</b>. Puedes repetirla: reemplaza solo lo migrado antes.</p>' +

  A.ejecutarMig = function (el) {

  function pintarReporteMig(r) {
    var v = r.ventas, p = r.pagos, c = r.compras, k = r.comprobacion || {};
    var h = '<div class="aviso ' + (r.simulacion ? 'info' : 'ok') + '">' + (r.simulacion ? 'Simulación: no se guardó nada.' : 'Migración guardada.') + ' Hoja: «' + esc(r.hoja) + '» · comentarios leídos en ' + r.comentariosLeidos + ' celdas.' + (r.yaHabiaMigracion ? '\nYa existía una migración: se reemplazará.' : '') + '</div>';
    h += '<div class="grid g4" style="margin-bottom:14px">' + kpi('Ventas', v.filas, v.unidades + ' und · ' + v.vendedores + ' vendedores') + kpi('Total vendido', dinero(v.total), v.contado + ' contado · ' + v.credito + ' crédito') +
      kpi('Cobrado', dinero(v.cobrado), p.total + ' pagos', 'ok') + kpi('Pendiente', dinero(v.pendiente), '', 'warn') +
      kpi('Pagos con fecha real', p.conFechaDeComentario, 'leída del comentario', 'ok') + kpi('Pagos con fecha estimada', p.sinFecha, 'sin comentario de fecha', p.sinFecha ? 'warn' : '') +
      kpi('Compras', c.facturas, c.unidades + ' und · ' + dinero(c.total)) + kpi('Productos nuevos', r.productos.nuevos, r.productos.sinLinea + ' sin línea') + '</div>';
    if (k.filaTotales) {
      h += '<div class="card"><h2>Comprobación con la fila de totales de la hoja (fila ' + k.filaTotales + ')</h2>' + tablaSimple(['', 'Hoja', 'Sistema', 'Diferencia'], [
        ['Total vendido', dinero(k.totalHoja), dinero(k.totalMigrado), '<b>' + dinero(k.diferenciaTotal) + '</b>'],
        ['Pendiente por cobrar', k.pendienteHoja === null ? '—' : dinero(k.pendienteHoja), dinero(k.pendienteMigrado), k.diferenciaPendiente === null ? '—' : '<b>' + dinero(k.diferenciaPendiente) + '</b>']
      ], [1, 2, 3]) + '<p class="muted peq">Las diferencias se explican en los avisos de abajo (filas donde el PENDIENTE de la hoja no cuadra con TOTAL − PAGOS, pagos de más, etc.).</p></div>';
    }
    var cc = r.conciliacion || {};
    h += '<div class="card"><h2>Compras vs ventas</h2><p class="peq">Compradas: <b>' + cc.comprado + '</b> und · Vendidas: <b>' + cc.vendido + '</b> und · <span style="color:var(--bad)"><b>' + cc.unidadesSinCompra + '</b> und vendidas sin compra registrada en ' + cc.skusNegativos + ' productos</span>. Revísalo luego en «Conciliación» y registra las facturas que falten.</p></div>';
    h += '<div class="card"><h2>Avisos (' + r.avisos.length + ')</h2>' + (r.errores.length ? '<div class="aviso bad">' + r.errores.map(esc).join('\n') + '</div>' : '') +

    $('migRes').innerHTML = h;
  }

  // ======================================================================
  // Arranque
  // ======================================================================
  function arrancar() {
    S.token = leerToken();
    if (S.token) {
      return api('yo').then(function (u) { S.usuario = u; return entrar(); }).catch(function (e) {
        if (e.message === 'DEBE_CAMBIAR_CLAVE') return;
        if (e.message !== 'SESION_VENCIDA') { cerrarSesionLocal(); }
        return verificarInstalacion();
      });
    }
    return verificarInstalacion();
  }
  function verificarInstalacion() {
    return llamar('estadoInstalacion', []).then(function (r) {
      if (!r.ok) return pantallaLogin(r.error);
      if (!r.data.instalada) return pantallaNoInstalada();
      if (!r.data.conUsuarios) return pantallaPrimerAdmin();
      if (!document.querySelector('.login')) pantallaLogin();
    }).catch(function (e) { pantallaLogin(e.message); });
  }

  window.CubittApp = { estado: S };
  arrancar();
})();
