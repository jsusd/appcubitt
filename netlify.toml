[build]
  command = "node -e \"const fs=require('fs');fs.mkdirSync('netlify/functions',{recursive:true});fs.writeFileSync('netlify/functions/menu.mjs',Buffer.from('','base64'));\""
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
